
# БЛОК 1: Сайт-заглушка (для старого домена)
server {
    listen 443 ssl;
    server_name cdnstore.shop *.cdnstore.shop;

    ssl_certificate /etc/nginx/ssl/cdnstore.crt;
    ssl_certificate_key /etc/nginx/ssl/cdnstore.key;

    root /var/www/html;
    index index.html;
}

# БЛОК 2: VPN и Подписки (для нового домена)
server {
    listen 443 ssl;
    server_name ruzone27.shop *.ruzone27.shop;

    ssl_certificate /etc/nginx/ssl/ruzone.crt;
    ssl_certificate_key /etc/nginx/ssl/ruzone.key;

    # 1. МАРШРУТ ДЛЯ ПОДПИСОК (отправляем на 8444)
    location /sub {
        proxy_pass http://127.0.0.1:8444;
        
        proxy_http_version 1.0;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sub_dark {
        proxy_pass http://127.0.0.1:8444;
        
        proxy_http_version 1.0;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /trojan/ {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.0;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. МАРШРУТ ДЛЯ VPN (отправляем на 80)
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_set_header Expect "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /trojan-ws {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
